# Garage-open overnight alert: email + SMS.
# SMS added 2026-07-31 after Twilio toll-free verification for (877) 600-5343 was
# approved (2026-07-30). Reuses the cabinet package's notify.alert_sms (twilio_sms)
# — the global `twilio:` key is declared ONLY in packages/cabinet_alerts.yaml;
# never declare a second one. SMS goes to Scott only, matching this package's
# email audience. Text follows the TFV-registered "HubWise Ops Alert" sample.
#
# The SMTP notifier is NO LONGER declared here. YAML `notify: platform: smtp`
# is removed in HA 2027.1; HA auto-imported the old block into a UI config
# entry ("garage_alert_email", Settings → Devices & Services → SMTP), which is
# now the only place the SMTP2GO credentials live. Alerts call the entity
# notify.garage_alert_email_swilson_hubwisetech_com via notify.send_message.
# Do NOT re-add a YAML smtp notifier here or in the future cabinet package.
input_boolean:
  garage_dad_alerted:
    name: Garage Dad Alerted
    icon: mdi:garage-alert
  garage_mom_alerted:
    name: Garage Mom Alerted
    icon: mdi:garage-alert

automation:
  - alias: "Garage - Dad open too long (overnight)"
    id: garage_dad_open_overnight
    triggers:
      - trigger: state
        entity_id: binary_sensor.0xffffb40e0601d430_contact
        to: "on"
        for: "00:10:00"
      # 22:10 catch-up: a door opened before 21:50 fires its state trigger
      # before the 22:00-05:00 window opens, so the time condition below
      # fails and the trigger never re-fires. This re-checks shortly after
      # the window starts so an already-open door still alerts.
      - trigger: time
        at: "22:10:00"
    conditions:
      - condition: time
        after: "22:00:00"
        before: "05:00:00"
      - condition: state
        entity_id: binary_sensor.0xffffb40e0601d430_contact
        state: "on"
        for: "00:10:00"
      - condition: state
        entity_id: input_boolean.garage_dad_alerted
        state: "off"
    actions:
      - action: notify.send_message
        target:
          entity_id: notify.garage_alert_email_swilson_hubwisetech_com
        data:
          title: "Garage Alert"
          message: >-
            Dad garage door has been open since
            {{ as_local(states['binary_sensor.0xffffb40e0601d430_contact'].last_changed).strftime('%-I:%M %p') }}
            (10+ minutes).
      - action: notify.alert_sms
        data:
          message: >-
            HubWise Ops Alert: Facility sensor 'Dad Garage' open since
            {{ as_local(states['binary_sensor.0xffffb40e0601d430_contact'].last_changed).strftime('%-I:%M %p') }}
            (10+ min). Reply HELP for help or STOP to opt out.
          target:
            - !secret alert_sms_scott
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.garage_dad_alerted

  - alias: "Garage - Dad closed all-clear"
    id: garage_dad_closed_all_clear
    triggers:
      - trigger: state
        entity_id: binary_sensor.0xffffb40e0601d430_contact
        to: "off"
    conditions:
      - condition: state
        entity_id: input_boolean.garage_dad_alerted
        state: "on"
    actions:
      - action: notify.send_message
        target:
          entity_id: notify.garage_alert_email_swilson_hubwisetech_com
        data:
          title: "Garage Alert - All Clear"
          message: "Dad garage door is now closed."
      - action: notify.alert_sms
        data:
          message: >-
            HubWise Ops Alert: Facility sensor 'Dad Garage' closed — all clear.
            Reply HELP for help or STOP to opt out.
          target:
            - !secret alert_sms_scott
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.garage_dad_alerted

  - alias: "Garage - Mom open too long (overnight)"
    id: garage_mom_open_overnight
    triggers:
      - trigger: state
        entity_id: binary_sensor.mom_garage_sensor_contact
        to: "on"
        for: "00:10:00"
      # 22:10 catch-up: a door opened before 21:50 fires its state trigger
      # before the 22:00-05:00 window opens, so the time condition below
      # fails and the trigger never re-fires. This re-checks shortly after
      # the window starts so an already-open door still alerts.
      - trigger: time
        at: "22:10:00"
    conditions:
      - condition: time
        after: "22:00:00"
        before: "05:00:00"
      - condition: state
        entity_id: binary_sensor.mom_garage_sensor_contact
        state: "on"
        for: "00:10:00"
      - condition: state
        entity_id: input_boolean.garage_mom_alerted
        state: "off"
    actions:
      - action: notify.send_message
        target:
          entity_id: notify.garage_alert_email_swilson_hubwisetech_com
        data:
          title: "Garage Alert"
          message: >-
            Mom garage door has been open since
            {{ as_local(states['binary_sensor.mom_garage_sensor_contact'].last_changed).strftime('%-I:%M %p') }}
            (10+ minutes).
      - action: notify.alert_sms
        data:
          message: >-
            HubWise Ops Alert: Facility sensor 'Mom Garage' open since
            {{ as_local(states['binary_sensor.mom_garage_sensor_contact'].last_changed).strftime('%-I:%M %p') }}
            (10+ min). Reply HELP for help or STOP to opt out.
          target:
            - !secret alert_sms_scott
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.garage_mom_alerted

  - alias: "Garage - Mom closed all-clear"
    id: garage_mom_closed_all_clear
