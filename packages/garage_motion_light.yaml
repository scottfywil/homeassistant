# Garage light follows Nest camera motion: on instantly, off after 15 quiet
# minutes. Single automation, no helper input_boolean/timer needed (see
# pattern note below).
#
# Entity IDs confirmed live by the user 2026-09-18 (Developer Tools → States):
#   light.garage_light          — the garage light (light.* domain, a bulb —
#                                  not a switch.* smart plug)
#   event.garage_camera_motion  — the Nest garage camera's motion event
#                                  (docs/08-presence-sensors.md's earlier
#                                  event.garage_garage_motion was an
#                                  unverified guess and was wrong)
#
# Pattern: Nest SDM camera sensors are `event` entities, not binary_sensors —
# they don't hold a stable on/off state. Each detection just bumps the
# entity's state to a new timestamp. A plain `trigger: state` with no
# `to:`/`from:` fires on every one of those bumps, which is the standard way
# to react to event entities. `mode: restart` means each new motion event
# cancels any already-pending turn-off delay and restarts it from zero — so
# one automation gets both "on instantly on motion" and "off after 15
# minutes of no further motion" with nothing else to maintain.
automation:
  - alias: "Garage light follows motion"
    id: garage_light_follows_motion
    mode: restart
    triggers:
      - trigger: state
        entity_id: event.garage_camera_motion
    actions:
      - action: light.turn_on
        target:
          entity_id: light.garage_light
      - delay: "00:15:00"
      - action: light.turn_off
        target:
          entity_id: light.garage_light
