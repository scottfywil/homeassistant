# Indoor climate rollups from ESP32 room sensors.
# Add each new room sensor's temperature entity to the list.
template:
  - sensor:
      - name: "Indoor average temperature"
        unique_id: indoor_average_temperature
        unit_of_measurement: "°F"
        device_class: temperature
        state_class: measurement
        state: >
          {% set temps = [
              states('sensor.office_sensor_temperature'),
            ] | reject('in', ['unknown', 'unavailable', 'none']) | map('float') | list %}
          {{ (temps | average) | round(1) if temps else none }}
        availability: >
          {{ [states('sensor.office_sensor_temperature')]
             | reject('in', ['unknown', 'unavailable', 'none']) | list | count > 0 }}

automation:
  # One-shot: set the Nest to 72°F at 9:00 AM on 2026-07-26, then disable itself.
  # The date condition is what makes it single-use; the self-disable is belt-and-braces
  # so a config reload on the same morning can't fire it twice. Delete this block (or
  # re-enable + bump the date) once it has run.
  - alias: "Climate - One-shot 72F setpoint (2026-07-26 09:00)"
    id: climate_oneshot_setpoint_20260726
    mode: single
    triggers:
      - trigger: time
        at: "09:00:00"
    conditions:
      - condition: template
        value_template: "{{ now().date() | string == '2026-07-26' }}"
    actions:
      # Nest in heat_cool mode rejects a single `temperature`; it needs a range.
      - choose:
          - conditions:
              - condition: state
                entity_id: climate.family_room_family_room
                state: "heat_cool"
            sequence:
              - action: climate.set_temperature
                target:
                  entity_id: climate.family_room_family_room
                data:
                  target_temp_low: 70
                  target_temp_high: 74
        default:
          - action: climate.set_temperature
            target:
              entity_id: climate.family_room_family_room
            data:
              temperature: 72
      - action: automation.turn_off
        target:
          entity_id: automation.climate_one_shot_72f_setpoint_2026_07_26
        data:
          stop_actions: false
