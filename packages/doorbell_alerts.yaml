# Doorbell-press alert: email (SMTP2GO, with a camera snapshot attached) +
# SMS (Twilio toll-free).
#
# Reuses the existing notifiers — does NOT redeclare `twilio:` or a
# `platform: twilio_sms` notifier (that's owned by packages/cabinet_alerts.yaml;
# only one `twilio:` key is allowed).
#
# Email action is `smtp.send_message`, NOT the generic `notify.send_message` —
# the generic action only exposes title/message; `attachments` is an extra
# field the smtp integration registers only under its own domain action.
# Confirmed live in Developer Tools → Actions 2026-09-02: picking the
# "Front Door Fluent" camera as an attachment auto-fills the `media_source`
# block below (HA resolves a `media-source://camera/...` reference to a fresh
# camera.async_get_image() snapshot at send time — NOT a live-stream clip,
# despite the HLS media_content_type, which is just the camera's normal
# browse-listing type). `continue_on_error` on this step means a snapshot
# hiccup (e.g. a slow/unreachable camera) still lets the SMS action fire.
#
# Sensor: Reolink `reolink` integration, device "Front Door" (Video Doorbell
# WiFi D340W) → Entryway. binary_sensor.front_door_visitor is the button-press
# sensor (momentary — fires "on" briefly, no "all-clear" needed, unlike the
# garage/cabinet open-sensor alerts). Verified live 2026-09-01 — see
# docs/09-integrations-status.md "Reolink note" and docs/11-reolink-doorbell.md.
#
# Audience: Scott + Megan (both), matching the cabinet package's household
# audience rather than the garage package's Scott-only ops audience — a
# doorbell press is a whole-household concern.
automation:
  - alias: "Doorbell - Front Door pressed"
    id: doorbell_front_door_pressed
    triggers:
      - trigger: state
        entity_id: binary_sensor.front_door_visitor
        from: "off"
        to: "on"
    actions:
      - action: smtp.send_message
        continue_on_error: true
        target:
          entity_id:
            - notify.garage_alert_email_swilson_hubwisetech_com
            - notify.garage_alert_email_megan
        data:
          title: "Someone's at the front door"
          message: >-
            The Front Door doorbell was pressed —
            {{ now().strftime('%b %-d, %-I:%M %p') }}.
          attachments:
            - media_source:
                media_content_id: media-source://camera/camera.front_door_fluent
                media_content_type: application/vnd.apple.mpegurl
              filename: front_door_snapshot.jpg
      - action: notify.alert_sms
        data:
          message: >-
            HubWise Ops Alert: Facility sensor 'Front Door' doorbell pressed —
            {{ now().strftime('%b %-d, %-I:%M %p') }}.
            Reply HELP for help or STOP to opt out.
          target:
            - !secret alert_sms_scott
            - !secret alert_sms_wife
